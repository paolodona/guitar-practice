[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woodshed"
version = "0.1.0"
description = "Guitar practice tool: slow down, transpose, loop, and count reps on commercial recordings."
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "pydantic>=2",
    "numpy",
    # Guitar-only isolation (Phase 1.5, Group S). Core rather than an extra,
    # Paolo's call 2026-09-12, and the reason is mechanical: `uv run --extra
    # dev pytest` (the quality gate) re-syncs the env to exactly the extras on
    # that line, so a demucs installed by `uv sync --extra separate` was
    # uninstalled again by the next test run and the practice screen went back
    # to asking for it. It pulls torch in, which is big -- that is the price,
    # paid once. CLAUDE.md's layering rule is unaffected: it governs what the
    # pure modules IMPORT, and `separate.py` is still the only module that may
    # touch demucs, still never at module top level.
    "demucs>=4.0.1",
    # Live capture (Phase 1.5, Group U). Same mechanical reason as demucs
    # above: `uv run --extra dev pytest` re-syncs the env to exactly the
    # extras on that line, so a pyaudiowpatch installed by `uv sync --extra
    # capture` was uninstalled again by the next test run and the capture
    # panel went back to degrading to "not installed" (see capture.js).
    # Windows-only, which this repo already is (CLAUDE.md's Shell section).
    # CLAUDE.md's layering rule is unaffected: capture.py is still the only
    # module that may import it, still never at module top level.
    "pyaudiowpatch",
]

[project.optional-dependencies]
analyze = ["librosa"]
render = []
# Kept, empty, so an old `uv sync --extra capture` or `--extra separate` in a
# note or a shell history still works instead of erroring on an unknown
# extra. pyaudiowpatch and demucs both moved to `dependencies` above; nothing
# is pinned in two places.
capture = []
separate = []
# `woodshed gx100 sync` (#3, N2 follow-up) -- SysEx over MIDI, gx100_sync.py's
# own module dependency. Same two packages the sibling gx100 repo uses for the
# same job, because they talk to the same wire.
gx100 = ["mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest", "ruff"]

[project.scripts]
woodshed = "woodshed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/woodshed"]

[tool.ruff]
line-length = 100
# design/ holds standalone one-off scripts for generating design-brief
# artboards -- not part of the woodshed package (see CLAUDE.md's "Layering":
# src/woodshed/ is the generic tool; design/ is not it) and not owned by any
# unit in the implementation plan. Scoped out of lint rather than fixed here.
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "needs_rubberband: requires the rubberband CLI binary on PATH (select with -m, not -k)",
    "needs_librosa: requires the librosa package installed (select with -m, not -k)",
    "needs_device: requires a real audio input/output device (select with -m, not -k)",
    "needs_demucs: requires the demucs package installed (select with -m, not -k)",
]
